let state={view:'home',cart:{},bottle:false,address:'Home · Flat 204, Sample Residency, Garden Road, Example Area',landmark:'Near the community entrance',instructions:'Please ring the doorbell.',timing:'now',date:'2026-10-15',slot:'10:00 AM–12:00 PM',logged:false,phone:'',otp:'',authMode:'phone',otpError:'',resendAt:0,payment:'pending',tracking:'Preparing',scenario:'normal',activeOrder:true,reprice:false,busy:false,returning:true};

function go(view){location.hash=view}window.addEventListener('hashchange',()=>{state.view=location.hash.slice(1)||'home';render();$('#app').focus();window.scrollTo(0,0)});
function render(){state.view=location.hash.slice(1)||state.view;const valid=['home','cart','checkout','login','payment','tracking','orders','account','deposits'];if(!valid.includes(state.view))state.view='home';$('#app').innerHTML=({home:home,cart:cart,checkout:checkout,login:login,payment:payment,tracking:tracking,orders:orders,account:account,deposits:deposits}[state.view])();$('#app').className='screen-enter';document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===state.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});$('#cart-bar').innerHTML=count()&&state.view==='home'?`<button class="wd-btn wd-btn-primary full between" onclick="go('cart')"><span>${count()} item${count()>1?'s':''} · View cart</span><span>${money(total())} →</span></button>`:'';icons()}
function productCard(p){return `<article class="wd-card product"><div class="product-visual"><span class="eyebrow">${p.deposit?'Returnable bottle':'Bottled water'}</span>${p.image}</div><div class="stack"><div><h3>${p.name}</h3><p class="small muted">${p.size}</p></div><div><div class="price-line">${money(p.price)}</div><div class="deposit-note">${p.deposit?'Includes ₹200 bottle deposit':'No bottle deposit applies'}</div></div><div class="row between"><span class="small ${p.unavailable?'muted':''}">${p.unavailable?'Unavailable':'Available · sample stock'}</span><button class="wd-btn wd-btn-${p.unavailable?'secondary':'primary'}" ${p.unavailable?'disabled':''} onclick="add('${p.id}')">${p.unavailable?'Unavailable':'+ Add'}</button></div></div></article>`}
function home(){return `<button class="back" onclick="addressDialog()">${icon('map-pin')}<span class="grow scroll-safe">Deliver to<br><strong>${esc(state.address)}</strong></span>${icon('chevron-down')}</button><section class="hero"><span class="eyebrow">A clearer way to order</span><h1>Water delivery.<br>Clear updates.</h1><p class="muted">Choose your water, review the full price, and see what happens next.</p></section>${state.activeOrder?`<section class="wd-card active-card section"><div class="row between wrap"><div class="row">${icon('package')}<span class="eyebrow">Your active order</span></div><span class="wd-status wd-status-progress">${state.tracking}</span></div><h3 style="margin:14px 0 5px!important">Order #CW-1042</h3><p class="small">Sample window: 10:00 AM–12:00 PM · 15 Oct 2026</p><div class="row between"><span class="small muted">Latest update: preparation started</span><button class="wd-btn wd-btn-secondary" onclick="go('tracking')">View progress →</button></div></section>`:''}<section class="section"><div class="subheading"><h2>Choose your water</h2><span class="small muted">Sample catalogue</span></div><div class="products">${products.map(productCard).join('')}</div></section>${state.returning?`<section class="wd-card section"><div class="row between wrap"><div><span class="eyebrow">Order again</span><h3 style="margin:8px 0!important">Your previous 20 L bottle</h3><p class="small muted">Review current price, availability and bottle choice before paying.</p></div><button class="wd-btn wd-btn-secondary" onclick="reorder()">Review reorder</button></div></section>`:''}<section class="section small muted">No delivery promise is shown until location and current availability are reviewed.</section><div class="scenario"><label for="customer-type">Reviewer control · customer journey</label><select id="customer-type" onchange="state.returning=this.value==='returning';state.activeOrder=state.returning;state.logged=state.returning;render()"><option value="returning" ${state.returning?'selected':''}>Returning customer</option><option value="first" ${!state.returning?'selected':''}>First-time customer</option></select></div>`}
function add(id){state.cart[id]=(state.cart[id]||0)+1;if((state.cart.bottle||0)!==1)state.bottle=false;render();toast('Added to your demo cart. No order has been placed.')}
function changeQty(id,d){state.cart[id]=Math.max(0,(state.cart[id]||0)+d);if(!state.cart[id])delete state.cart[id];if((state.cart.bottle||0)!==1)state.bottle=false;render()}
function summary(){return `<div id="summary"><div class="summary-row"><span>Products ${state.cart.bottle?'(incl. deposit)':''}</span><span>${money(subtotal())}</span></div><div class="summary-row"><span>Existing-bottle deduction</span><span>${deduction()? '−'+money(deduction()):'Not selected'}</span></div><div class="summary-row"><span>Delivery charge <span class="tiny muted">(sample)</span></span><span>₹0</span></div><div class="summary-row summary-total"><span>Total</span><span>${money(total())}</span></div><p class="tiny muted" style="margin-top:10px!important">Illustrative pricing. Actual delivery charges and deposit policy are not configured.</p></div>`}
function bottleChoice(){if(!state.cart.bottle)return '';if(state.cart.bottle>1)return notice('warn','Multiple-bottle policy needs approval','The prototype does not calculate deductions for multiple bottles. Use one bottle to review the supplied ₹200 example.');return `<label class="choice ${state.bottle?'wd-selected':''}"><input type="checkbox" ${state.bottle?'checked':''} onchange="toggleBottle(this.checked)"><span><strong>I already have a bottle</strong><span class="small" style="display:block">Deduct ₹200 for this one-bottle example.</span><span class="tiny muted" style="display:block;margin-top:6px">Policy pending: empty-bottle handover, eligibility and missing-bottle handling must be confirmed. This is not a deposit-balance redemption.</span></span></label>`}
function toggleBottle(x){state.bottle=x;render();$('#summary')?.classList.add('changed');toast(x?'Demo bottle deduction applied: −₹200.':'Bottle deduction removed. Total updated.')}
function cart(){return `<button class="back" onclick="go('home')">← Continue browsing</button><h1 class="screen-title">Your cart</h1>${!count()?`<div class="empty"><h2>Your cart is empty</h2><p>Add water products to review an order.</p><button class="wd-btn wd-btn-primary" onclick="go('home')">Browse water</button></div>`:`<div class="wd-checkout-grid stack"><section class="stack">${state.reprice?notice('warn','Reorder changes to review','The sample bottle price changed from ₹280 to ₹300. The previous address, timing and bottle choice have not been silently applied.'):''}${Object.entries(state.cart).map(([id,q])=>`<article class="wd-card"><div class="row"><div class="grow"><h3 style="margin:0 0 5px!important">${pby(id).name}</h3><p class="small muted">${pby(id).size}</p><p class="deposit-note">${pby(id).deposit?'Price includes ₹200 bottle deposit':'No bottle deposit applies'}</p></div><strong>${money((pby(id).price+(state.reprice&&id==='bottle'?20:0))*q)}</strong></div><div class="quantity-control"><button aria-label="Decrease ${pby(id).name} quantity" onclick="changeQty('${id}',-1)">−</button><span aria-label="Quantity">${q}</span><button aria-label="Increase ${pby(id).name} quantity" onclick="changeQty('${id}',1)">+</button></div></article>`).join('')}<section class="wd-card stack"><h3 style="margin:0!important">Bottle option</h3>${bottleChoice()||'<p class="small muted">No bottle deposit applies to these products.</p>'}</section></section><aside class="wd-card"><h2 style="margin-top:0!important">Price breakdown</h2>${summary()}<button class="wd-btn wd-btn-primary full section" onclick="go('checkout')">Continue to checkout →</button></aside></div>`}`}
function deliveryLabel(){return state.timing==='now'?'Order now · sample estimate: 10:00 AM–12:00 PM, 15 Oct 2026':`Scheduled · ${state.date} · ${state.slot}`}
function checkout(){if(!count())return cart();return `<button class="back" onclick="go('cart')">← Cart</button><h1 class="screen-title">Review your delivery</h1><div class="wd-checkout-grid stack"><section class="stack"><article class="wd-card"><div class="row between"><h3 style="margin:0!important">Delivery address</h3><button class="back" onclick="addressDialog()">Change</button></div><p class="section scroll-safe">${esc(state.address)}</p><p class="small muted">${esc(state.landmark)}<br>${esc(state.instructions)}</p></article><article class="wd-card stack"><h3 style="margin:0!important">When would you like it?</h3><div class="segmented"><button class="wd-btn ${state.timing==='now'?'wd-btn-primary':'wd-btn-secondary'}" aria-pressed="${state.timing==='now'}" onclick="state.timing='now';render()">Order now</button><button class="wd-btn ${state.timing==='schedule'?'wd-btn-primary':'wd-btn-secondary'}" aria-pressed="${state.timing==='schedule'}" onclick="state.timing='schedule';render()">Schedule delivery</button></div>${state.timing==='now'?notice('info','Sample estimate: 10:00 AM–12:00 PM','15 Oct 2026 · illustrative availability, not a service commitment.'):`<label class="wd-label">Date<input class="wd-input" type="date" value="${state.date}" min="2026-10-15" onchange="state.date=this.value;state.slot='';render()"></label><div class="slots">${['10:00 AM–12:00 PM','12:00–2:00 PM','2:00–4:00 PM','4:00–6:00 PM'].map((s,i)=>`<button class="slot ${state.slot===s?'wd-selected':''}" ${i===1?'disabled':''} aria-pressed="${state.slot===s}" onclick="state.slot='${s}';render()">${s}${i===1?'<br><span class="tiny">Fully booked · sample</span>':''}</button>`).join('')}</div><p class="small muted">${state.slot?'Selected: '+esc(state.date)+' · '+state.slot:'Choose an available delivery window.'}</p>`}</article><article class="wd-card stack"><h3 style="margin:0!important">Products and bottle choice</h3>${Object.entries(state.cart).map(([id,q])=>`<p class="small">${pby(id).name} × ${q}</p>`).join('')}${bottleChoice()}</article></section><aside class="wd-card"><h2 style="margin-top:0!important">Order summary</h2>${summary()}<hr class="muted-rule"><p class="small">${deliveryLabel()}</p><p class="small muted">Online payment through Cashfree. No cash-on-delivery option.</p><button class="wd-btn wd-btn-primary full" onclick="beginPayment()">${state.logged?'Pay '+money(total())+' with Cashfree':'Sign in to continue'}</button><p class="tiny muted section">Prototype only: no money is collected.</p></aside></div>`}
function addressDialog(){modal('Delivery address',`<div class="stack"><button class="choice" onclick="closeModal();render()"><span class="grow"><strong>Saved address · Home</strong><span class="small" style="display:block">${esc(state.address)}</span></span><span>Selected</span></button><form id="address-form" onsubmit="saveAddress(event)"><label class="wd-label">Address details<textarea required class="wd-input" id="address-value">${esc(state.address)}</textarea></label><label class="wd-label">Landmark<input class="wd-input" id="landmark-value" value="${esc(state.landmark)}"></label><label class="wd-label">Delivery instructions<textarea class="wd-input" id="instructions-value">${esc(state.instructions)}</textarea></label><p class="small muted">Manual entry is supported. Recipient fields and coverage validation need business approval.</p><button class="wd-btn wd-btn-primary full">Use this address</button></form><button class="wd-btn wd-btn-secondary" onclick="unsupportedAddress()">Review unsupported-address state</button></div>`)}
function otpHelp(){modal('Code did not arrive','<p>Check the phone number, wait for resend availability, then request a new code.</p><p class="small muted">The final support route requires approval. No order-update SMS is included.</p>')}
function unsupportedAddress(){closeModal();modal('Address not supported',notice('warn','Sample unsupported-address state','Choose or enter a different address. Live coverage rules are not configured.'),'<button class="wd-btn wd-btn-primary" onclick="closeModal();addressDialog()">Choose another address</button>')}
function saveAddress(e){e.preventDefault();if(blocked())return;state.address=$('#address-value').value.trim();state.landmark=$('#landmark-value').value;state.instructions=$('#instructions-value').value;closeModal();render();toast('Demo address saved. Coverage has not been checked.')}
function beginPayment(){if(!count())return;if(state.timing==='schedule'&&!state.slot){toast('Choose an available delivery window first.');return}if(state.cart.bottle>1){toast('Multi-bottle deposit policy is unresolved. Review with one bottle before proceeding in this demo.');return}if(blocked())return;if(!state.logged){go('login');return}state.payment='initiation';go('payment')}
function login(){return `<button class="back" onclick="go('checkout')">← Checkout</button><section class="wd-card" style="max-width:480px;margin:20px auto"><span class="eyebrow">Keep your order</span><h1>Sign in to continue</h1><p class="small muted">Your cart and delivery choices are preserved. SMS is used for login OTP only.</p>${state.authMode==='phone'?`<form onsubmit="sendOTP(event)"><label class="wd-label">Phone number<div class="row"><span>+91</span><input id="phone" class="wd-input" type="tel" inputmode="numeric" autocomplete="tel-national" pattern="[0-9]{10}" maxlength="10" required value="${esc(state.phone)}" placeholder="10-digit number"></div></label><button class="wd-btn wd-btn-primary full" ${state.busy?'disabled':''}>${state.busy?'Sending code…':'Request OTP'}</button><p class="tiny muted section">Demo: no SMS is sent.</p></form>`:`<p class="small">Code requested for +91 ${esc(state.phone)} <button class="back" onclick="state.authMode='phone';render()">Change</button></p><form onsubmit="verifyOTP(event)"><label class="wd-label">Verification code<input id="otp" class="wd-input" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required value="${esc(state.otp)}" ${state.otpError?'aria-invalid="true" aria-describedby="otp-error"':''}></label>${state.otpError?`<p id="otp-error" class="error notice small" role="alert">${state.otpError}</p>`:''}<button class="wd-btn wd-btn-primary full" ${state.busy?'disabled':''}>${state.busy?'Verifying…':'Verify and continue'}</button></form><button id="resend-btn" class="back" onclick="resendOTP()"></button><p class="small muted">Demo valid code: 123456. Use 000000 to review expiry.</p><button class="back" onclick="otpHelp()">Didn't receive the code?</button>`}</section>`}
async function sendOTP(e){e.preventDefault();if(blocked())return;state.phone=$('#phone').value;state.busy=true;render();await new Promise(r=>setTimeout(r,600));if(blocked()){state.busy=false;render();return}state.busy=false;state.authMode='otp';state.resendAt=Date.now()+30000;render()}
function resendOTP(){if(Date.now()<state.resendAt||blocked())return;state.resendAt=Date.now()+30000;state.otpError='';render();toast('Demo: a new code request was confirmed. No SMS was sent.')}
async function verifyOTP(e){e.preventDefault();if(blocked())return;state.otp=$('#otp').value;state.busy=true;render();await new Promise(r=>setTimeout(r,600));state.busy=false;if(blocked()){render();return}if(state.otp==='000000')state.otpError='This code has expired. Request a new code when resend is available.';else if(state.otp!=='123456')state.otpError='This code is not valid. Check the six digits and try again.';else{state.logged=true;state.otpError='';go('checkout');return}render()}
setInterval(()=>{const b=$('#resend-btn');if(b){let secs=Math.max(0,Math.ceil((state.resendAt-Date.now())/1000));b.disabled=secs>0;b.textContent=secs?'Resend in '+secs+'s':'Resend OTP'}},1000);
function payment(){let title,copy,kind='neutral';if(state.payment==='initiation'){title='Ready to open payment';copy='In the live service, this step initiates Cashfree. Choose a simulated outcome below.'}else if(state.payment==='processing'){title='Payment processing';copy='The payment outcome is not confirmed. No order success is shown.'}else if(state.payment==='success'){title='Payment successful · order confirmed';copy='Simulated confirmation for order #CW-1043. No payment was collected.';kind='success'}else if(state.payment==='paid-unconfirmed'){title='Payment received · order confirmation pending';copy='Payment and order confirmation are separate. Check status; do not pay again.'}else if(state.payment==='failed'){title='Payment failed';copy='This simulated failure is definitive. You can review checkout and retry.';kind='error'}else if(state.payment==='exit'){title='You left the payment screen';copy='Leaving payment does not establish failure. Check status before paying again.'}else{title='Payment confirmation pending';copy='We have not confirmed this payment. Check its status before paying again.'}return `<button class="back" onclick="go('orders')">← Orders</button><section class="wd-card" style="max-width:600px;margin:20px auto">${notice(kind,title,copy)}<div class="section"><div class="summary-row"><span>Amount</span><strong>${money(total())}</strong></div><div class="summary-row"><span>Reference</span><span>DEMO-PAY-1043</span></div><p class="small">${deliveryLabel()}</p><p class="small scroll-safe">${esc(state.address)}</p></div>${state.payment==='success'?`<button class="wd-btn wd-btn-primary full" onclick="state.tracking='Confirmed';state.scenario='normal';go('tracking')">Track confirmed demo order</button>`:state.payment==='failed'?`<button class="wd-btn wd-btn-primary full" onclick="go('checkout')">Review checkout and retry</button>`:`<button class="wd-btn wd-btn-primary full" onclick="checkPayment()">Check payment status</button><p class="small muted section">No second payment action while this outcome is unresolved.</p>`}<button class="back" onclick="help()">Payment help</button><div class="scenario"><label for="payment-scenario">Reviewer control · simulated outcome</label><select id="payment-scenario" onchange="state.payment=this.value;render()">${[['initiation','Initiation'],['processing','Processing'],['pending','Pending / unverified'],['paid-unconfirmed','Paid, order not confirmed'],['success','Payment and order confirmed'],['failed','Definitive failure'],['exit','Customer exit']].map(([k,t])=>`<option value="${k}" ${state.payment===k?'selected':''}>${t}</option>`).join('')}</select></div></section>`}
async function checkPayment(){if(blocked())return;toast('Checking demo payment status…');await new Promise(r=>setTimeout(r,700));if(blocked())return;toast('Demo result remains unresolved. Use reviewer controls to inspect another outcome.')}
function help(){modal('Help with this order','<p>The approved support channel, hours and escalation policy are not yet configured.</p><p class="small muted">This placeholder must be replaced before release. No phone number or response-time promise has been invented.</p>')}

ed section">Assignment: ${current>=3?'assigned · demo record':'not yet confirmed'}</p>${current>=3?'<p class="small">Customer-visible rider details require approval; no contact data is invented.</p>':''}<button class="wd-btn wd-btn-secondary full" onclick="help()">Get help</button></section><div class="scenario"><label>Reviewer control · tracking exception</label><select aria-label="Reviewer state selection" onchange="state.scenario=this.value;if(this.value==='assignment')state.tracking='Ready for dispatch';render()"><option value="normal" ${state.scenario==='normal'?'selected':''}>Normal progress</option><option value="delayed" ${state.scenario==='delayed'?'selected':''}>Delayed / revised estimate</option><option value="assignment" ${state.scenario==='assignment'?'selected':''}>Assignment pending</option></select><label class="section">Reviewer control · confirmed event</label><select aria-label="Reviewer state selection" onchange="state.tracking=this.value;render()">${stages.map(s=>`<option ${state.tracking===s?'selected':''}>${s}</option>`).join('')}</select></div></aside></div>`}
function orders(){return `<h1>Your orders</h1><p class="muted">Open an order for progress, timing and payment details.</p><section class="wd-card section"><div class="row between wrap"><div><h3>#CW-1042</h3><p>20 L bottle × 1 · 15 Oct 2026</p><span class="wd-status wd-status-progress">${state.tracking}</span></div><button class="wd-btn wd-btn-primary" onclick="go('tracking')">View order</button></div></section><section class="wd-card section"><div class="row between wrap"><div><h3>#CW-0987</h3><p>20 L bottle × 1 · 8 Oct 2026</p><span class="wd-status wd-status-success">Delivered · demo record</span></div><button class="wd-btn wd-btn-secondary" onclick="reorder()">Review reorder</button></div></section><div class="scenario"><label>Reviewer scenario · changed reorder</label><button class="wd-btn wd-btn-secondary" onclick="reorder(true)">Review repriced / unavailable product</button></div>`}
function reorder(changed=false){state.cart={bottle:1};state.bottle=false;state.reprice=changed;state.timing='now';go('cart');if(changed)toast('Sample unavailable pack was not added. Bottle price changed; review your cart.');else toast('Previous product added for review. Address, timing and bottle choice require confirmation.')}
function account(){return `<h1>Your account</h1><p class="muted">Addresses, bottle records and update preferences.</p><div class="stack section"><button class="choice" onclick="addressDialog()">${icon('map-pin')}<span>Saved addresses</span></button><button class="choice" onclick="go('deposits')">${icon('receipt')}<span>Bottle-deposit records</span></button><button class="choice" onclick="pushDialog()">${icon('bell')}<span>Push update preferences<br><span class="small muted">${pushState}</span></span></button><button class="choice" onclick="showInstall()">${icon('download')}<span>Install prototype · optional</span></button></div>`}
function deposits(){return `<button class="back" onclick="go('account')">← Account</button><h1>Bottle-deposit records</h1>${notice('neutral','Recorded deposit: ₹200','Sample record only. This does not establish exchange eligibility or a redeemable balance.')}<section class="wd-card section"><h3>Related record</h3><p>Order #CW-0987 · Recorded deposit ₹200</p><p class="small muted">Bottle possession, exchange history and deposit status are separate concepts. Supported record fields still need confirmation.</p></section><p class="small muted section">Refund, withdrawal and redemption actions are intentionally absent.</p>`}
notifications=[{title:'Order preparation started',body:'Order #CW-1042 · open order details.',read:false},{title:'Delivery estimate revised',body:'Review the sample delayed-delivery state.',read:false}];function notificationDestination(i){if(i===1)state.scenario='delayed';go('tracking')}
render();

init();</script></body></html>
