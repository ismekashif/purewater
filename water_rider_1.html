function go(s){location.hash=s}window.addEventListener('hashchange',()=>{riderView=location.hash.slice(1)||'requests';render();$('#app').focus()});
function render(){if(!['requests','active','history'].includes(riderView))riderView='requests';document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===riderView)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});$('#app').innerHTML=`<div class="tabs" aria-label="Rider workspace"><button class="${riderView==='requests'?'active':''}" onclick="go('requests')">Requests</button><button class="${riderView==='active'?'active':''}" onclick="go('active')">Active deliveries</button><button class="${riderView==='history'?'active':''}" onclick="go('history')">History</button></div>${riderView==='requests'?requestScreen():riderView==='active'?activeScreen():historyScreen()}`;icons()}
function requestScreen(){return `<h1>Delivery requests</h1><p class="muted">Review pickup, quantity and timing before responding.</p><section class="wd-card request-summary section"><div class="row between wrap"><span class="eyebrow">Request · #CW-1042</span>${requestState==='received'?'<span id="countdown" class="countdown" aria-label="Response time remaining">01:30</span>':''}</div><h2>20 L water bottle × 1</h2><div class="data-block"><span class="eyebrow">Pickup</span><p>Sample Water Store<br><span class="small muted">12 Example Market Road</span></p></div><div class="data-block"><span class="eyebrow">Delivery</span><p>Example Area · Garden Road<br><span class="small muted">Address visibility on requests needs approval.</span></p></div><div class="data-block"><span class="eyebrow">Timing</span><p>Order now<br><span class="small muted">Sample window: 15 Oct · 10:00 AM–12:00 PM</span></p></div>${requestState==='received'?`<div class="stack"><button class="wd-btn wd-btn-primary full" onclick="acceptRequest()">Accept request</button><div style="height:8px"></div><button class="wd-btn wd-btn-secondary full" onclick="declineDialog()">Decline request</button></div>`:requestState==='accepting'?notice('neutral','Verifying acceptance…','Do not assume the request is yours until confirmation.'):requestState==='accepted'?notice('success','Request accepted · demo','Open Active deliveries. The order is not yet marked out for delivery.'):requestState==='unverified'?notice('neutral','Acceptance could not be verified','Do not start this delivery based on an unconfirmed assignment. Check status.'):notice('neutral',requestState==='declined'?'Request declined':requestState==='timeout'?'Response timed out':'Request no longer available','This request is no longer actionable. Reassignment is handled by dispatch.')}<div class="section">${requestState==='accepted'?'<button class="wd-btn wd-btn-primary full" onclick="go(\'active\')">Open active delivery</button>':requestState==='unverified'?'<button class="wd-btn wd-btn-secondary full" onclick="if(!blocked())toast(\'Demo assignment remains unverified. No acceptance is assumed.\')">Check assignment status</button>':''}</div></section><div class="scenario"><label>Reviewer control · request outcome</label><select aria-label="Reviewer state selection" onchange="setRequest(this.value)">${[['received','Request received'],['accepted','Confirmed acceptance'],['declined','Declined'],['timeout','Timed out'],['unavailable','No longer available'],['unverified','Acceptance unverified']].map(([k,t])=>`<option value="${k}" ${requestState===k?'selected':''}>${t}</option>`).join('')}</select><label class="choice section"><input type="checkbox" onchange="acceptFailure=this.checked" ${acceptFailure?'checked':''}><span class="small">Simulate acceptance-verification failure</span></label></div>`}
function setRequest(s){requestState=s;accepted=s==='accepted';if(s==='received')requestExpiry=Date.now()+90000;render()}
async function acceptRequest(){if(blocked())return;if(Date.now()>=requestExpiry){setRequest('timeout');return}requestState='accepting';render();await new Promise(r=>setTimeout(r,700));if(blocked()){requestState='unverified';render();return}if(requestState!=='accepting')return;requestState=acceptFailure?'unverified':'accepted';accepted=!acceptFailure;render();if(accepted)toast('Demo acceptance confirmed. Departure has not been recorded.')}
function declineDialog(){modal('Decline this request?','<p>Order #CW-1042 will no longer be actionable for you. Dispatch handles the next assignment attempt.</p>','<button class="wd-btn wd-btn-secondary" onclick="closeModal()">Keep reviewing</button><button class="wd-btn wd-btn-primary" onclick="declineRequest()">Confirm decline</button>')}
function declineRequest(){if(blocked())return;if(Date.now()>=requestExpiry){closeModal();setRequest('timeout');return}closeModal();setRequest('declined');toast('Demo decline confirmed. Request returned to dispatch.')}
setInterval(()=>{if(requestState!=='received')return;const s=Math.max(0,Math.ceil((requestExpiry-Date.now())/1000));const node=$('#countdown');if(node)node.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s===0){requestState='timeout';render()}},1000);
function activeScreen(){if(!accepted)return `<h1>Active deliveries</h1><div class="empty"><h2>No confirmed active delivery</h2><p>Accept a request and wait for confirmation before starting.</p><button class="wd-btn wd-btn-primary" onclick="go('requests')">View requests</button></div>`;if(delivered)return `<h1>Delivery completed</h1>${notice('success','Order #CW-1042 delivered','Simulated completion confirmed. No delivery photo, customer OTP or signature is required by this prototype.')}<button class="wd-btn wd-btn-secondary full section" onclick="go('history')">View delivery history</button>`;return `<h1>Active delivery</h1><section class="wd-card request-summary"><div class="row between wrap"><strong>#CW-1042</strong><span class="wd-status wd-status-progress">${deliveryStatus}</span></div><div class="data-block section"><span class="eyebrow">Pickup</span><p>Sample Water Store<br>12 Example Market Road</p></div><div class="data-block"><span class="eyebrow">Deliver to</span><p class="scroll-safe">Flat 204, Sample Residency, Garden Road, Example Area</p><p class="small muted">Customer instruction: ring the doorbell.</p></div><div class="data-block"><span class="eyebrow">Products</span><p>20 L returnable water bottle × 1</p></div><div class="data-block"><span class="eyebrow">Bottle instructions</span><p class="small">Exchange and missing-bottle instructions are pending policy approval. Do not infer a required handover from the deduction alone.</p></div>${deliveryStatus!=='Out for delivery'?notice('neutral','Assignment is not departure','Use the reviewer event control below to inspect the confirmed departure state. The actual pickup/departure workflow is unresolved.'):''}<button class="wd-btn wd-btn-primary full section" ${deliveryStatus!=='Out for delivery'?'disabled':''} onclick="deliveredDialog()">Mark delivered</button><p class="tiny muted section">Prototype eligibility: enabled after the sample departure event. Actual permissions and transitions require validation.</p></section><div class="scenario"><label>Reviewer control · confirmed operational event</label><select aria-label="Reviewer state selection" onchange="deliveryStatus=this.value;render()"><option ${deliveryStatus==='Assigned'?'selected':''}>Assigned</option><option ${deliveryStatus==='Out for delivery'?'selected':''}>Out for delivery</option></select></div>`}
function deliveredDialog(){modal('Confirm delivery completed',`<p><strong>Order #CW-1042</strong></p><p>20 L bottle × 1</p><p>Flat 204, Sample Residency, Garden Road, Example Area</p><p class="small muted">Confirm only when delivery is complete. No completion is recorded until the system confirms.</p>`,`<button class="wd-btn wd-btn-secondary" onclick="closeModal()">Not yet</button><button id="complete-btn" class="wd-btn wd-btn-primary" onclick="completeDelivery()">Confirm delivered</button>`)}
async function completeDelivery(){if(blocked())return;$('#complete-btn').disabled=true;$('#complete-btn').textContent='Confirming delivery…';await new Promise(r=>setTimeout(r,700));if(blocked()){$('#complete-btn').disabled=false;$('#complete-btn').textContent='Confirm delivered';return}delivered=true;closeModal();render();toast('Demo completion confirmed.')}
function historyScreen(){return `<h1>Delivery history</h1><section class="wd-card"><h3>#CW-0987</h3><p>20 L bottle × 1 · Example Area</p><span class="wd-status wd-status-success">Delivered · sample record</span><p class="small muted section">8 Oct 2026</p></section>${delivered?'<section class="wd-card section"><h3>#CW-1042</h3><span class="wd-status wd-status-success">Delivered · demo confirmation</span></section>':''}`}
notifications=[{title:'Delivery request received',body:'Review the sample pickup, quantity and timing.',read:false},{title:'Assignment changed',body:'Review a request that is no longer available.',read:false}];function notificationDestination(i){if(i===1)setRequest('unavailable');go('requests');render()}
render();

init();</script></body></html>
